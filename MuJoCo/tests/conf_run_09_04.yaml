defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "loco-mujoco-kbot"

experiment:
  task_factory:
    name: ImitationFactory
    params:
      amass_dataset_conf:
        # We will use just a few CMU datasets for testing. 
        # These will be automatically retargeted using KBot's smpl config.
        rel_dataset_path:
          - "CMU/09/09_04_poses.npz"

  env_params:
    env_name: MjxKBotLegsV2
    headless: True
    horizon: 1000
    goal_type: GoalTrajMimic
    goal_params:
      visualize_goal: true
    control_type: ${control_config.position_control.control_type}
    control_params: ${control_config.position_control.control_params}
    reward_type: MimicReward
    reward_params:
      qpos_w_sum: 0.4
      qvel_w_sum: 0.2
      rpos_w_sum: 0.5
      rquat_w_sum: 0.3
      rvel_w_sum: 0.1
      energy_coeff: 0.0005
      regen_efficiency: 0.5
      sites_for_mimic:
        - upper_body_mimic
        - pelvis_mimic
        - left_foot_mimic
        - right_foot_mimic
        - head_mimic

  # PPOJax hyperparameters
  hidden_layers: [512, 256]
  lr: 1e-4
  num_envs: 2048
  num_steps: 400
  total_timesteps: 100000000
  update_epochs: 4
  proportion_env_reward: 0.0
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.2
  learnable_std: false
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: false
  weight_decay: 0.0
  normalize_env: true
  debug: true
  n_seeds: 1
  vmap_across_seeds: true
  validation:
    active: true
    num_steps: 100
    num_envs: 100
    num: 10

control_config:
  position_control:
    control_type: PDControl
    control_params:
      p_gain:
        - 200
        - 200
        - 200
        - 300
        - 40 
        - 200
        - 200
        - 200
        - 300
        - 40 
      d_gain:
        - 5 
        - 5 
        - 5 
        - 6 
        - 2 
        - 5 
        - 5 
        - 5 
        - 6 
        - 2 
