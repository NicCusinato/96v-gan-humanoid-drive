# Gearbox / Transmission Library
# Covers planetary, cycloidal, harmonic, and spur options
# Units: SI

gearboxes:

  # ─── Planetary (low-backlash inline) ─────────────────────────────────────────
  - id: planet_3
    name: "Planetary 3:1"
    type: planetary
    GR: 3.0
    eta: 0.96        # efficiency
    J_gear: 5.0e-6   # kg·m² referred to motor shaft
    friction_Nm: 0.05
    mass: 0.08
    notes: "Single-stage, low GR, backdrivable"

  - id: planet_5
    name: "Planetary 5:1"
    type: planetary
    GR: 5.0
