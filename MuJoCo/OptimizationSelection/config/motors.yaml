# Motor Component Library
# Units: SI (N·m, A, Ω, kg, kg·m², rad/s)
# Sources: datasheets from T-Motor, Maxon, Robstride, Kollmorgen, Allied Motion

motors:

  # ─── T-Motor / Antigravity Series ────────────────────────────────────────────
  - id: tmotor_u8_lite
    name: "T-Motor U8 Lite KV100"
    manufacturer: T-Motor
    series: U8 Lite
    kt: 0.0955        # N·m/A (= 1/Kv in SI units, Kv=100 rpm/V)
    kv_rpm_v: 100
    ke: 0.0955        # V·s/rad  (= kt for ideal motor)
    R_phase: 0.078    # Ohm, phase resistance
    L_phase: 0.000065 # H, phase inductance
    I_cont: 18.0      # A continuous
    I_peak: 40.0      # A peak (≤2 s)
    T_cont: 17.1      # N·m continuous
    T_peak: 38.0      # N·m peak
    omega_rated: 522  # rad/s no-load at 96V (Kv * V_bus * π/30)
    J_rotor: 0.000095 # kg·m²
    mass: 0.415       # kg
    P_rated_W: 1000
    notes: "Outrunner, suited for direct-drive or low-GR hip/knee"

  - id: tmotor_ak80_9
    name: "T-Motor AK80-9"
    manufacturer: T-Motor
    series: AK80
    kt: 0.091
    kv_rpm_v: 100
    ke: 0.0955
    R_phase: 0.083
    L_phase: 0.000057
    I_cont: 15.0
    I_peak: 24.0
    T_cont: 9.0         # after 9:1 internal gear; bare motor ~1 N·m → here we store bare motor values
    T_peak: 18.0
    omega_rated: 1005   # rad/s at 96V (internal reduction already in AK — we model bare motor)
    J_rotor: 0.0000082
    mass: 0.485
    P_rated_W: 500
    notes: "Quasi-direct-drive cycloidal; internal GR=9 already. Model as bare motor, set GR separately."

